<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Deep IoT Blue gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Animated Background Elements --- */
        .bg-pulse {
            position: absolute;
            top: 50%; left: 50%;
            width: 100vw; height: 100vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(13,110,253,0.15) 0%, transparent 50%);
            animation: pulse 8s infinite alternate;
            z-index: 0;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .iot-node {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* --- Premium Glassmorphism Card --- */
        .login-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            z-index: 1;
            color: #ffffff;
        }

        .brand-icon {
            font-size: 2.5rem;
            color: #0d6efd;
            background: rgba(13, 110, 253, 0.15);
            width: 70px;
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 1px solid rgba(13, 110, 253, 0.3);
        }

        /* --- Form Inputs --- */
        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            color: #94a3b8;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            color: #ffffff;
            padding: 0.75rem 1rem 0.75rem 0;
            box-shadow: none;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #0d6efd;
            border-top: 1px solid #0d6efd;
            border-bottom: 1px solid #0d6efd;
        }
        .input-group:focus-within .input-group-text { border-left: 1px solid #0d6efd; color: #0d6efd; }
        .input-group:focus-within .form-control { border-right: 1px solid #0d6efd; }

        /* --- Button --- */
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 10px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 20px -5px rgba(13, 110, 253, 0.6);
            transform: translateY(-2px);
        }

        /* --- Alerts --- */
        .alert-danger {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #fca5a5;
            font-size: 0.85rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="bg-pulse"></div>
    <div class="iot-node" style="width: 120px; height: 120px; top: 15%; left: 15%; animation-delay: 0s;"></div>
    <div class="iot-node" style="width: 180px; height: 180px; bottom: 10%; right: 10%; animation-delay: 2s;"></div>
    <div class="iot-node" style="width: 70px; height: 70px; top: 30%; right: 25%; animation-delay: 1s;"></div>
    <div class="iot-node" style="width: 90px; height: 90px; bottom: 25%; left: 20%; animation-delay: 3s;"></div>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="bi bi-cpu"></i>
            </div>
            <h4 class="fw-bold mb-1">IoT Dashboard</h4>
            <p class="text-secondary small" style="color: #94a3b8 !important;">Enter your credentials to login</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger p-2 text-center" role="alert">
                    <i class="bi bi-exclamation-circle me-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text rounded-start"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control rounded-end" id="username" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text rounded-start"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control rounded-end" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="mt-4 text-center">
            <small style="color: #94a3b8;">Forgot password? Contact <span class="text-white">FertisenseLLP</span></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
